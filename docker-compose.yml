# Stack del frontend para Portainer.
# Define en el stack las variables NEXT_PUBLIC_API_BASE_URL y NEXT_PUBLIC_GOOGLE_CLIENT_ID:
# Portainer las sustituye abajo y se usan al CONSTRUIR la imagen (Next las fija en el build).
# Si cambian, hay que reconstruir la imagen ("Re-pull and redeploy" / "Build").
services:
  fabribat-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Defina NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?Defina NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: fabribat-frontend:latest
    container_name: fabribat-frontend
    restart: unless-stopped
    # Solo accesible desde la propia VM; el público entra por el proxy (deploy/proxy)
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - fabribat
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  fabribat:
    external: true
