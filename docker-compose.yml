# Stack del frontend para Portainer.
# Define en el stack las variables NEXT_PUBLIC_API_BASE_URL y NEXT_PUBLIC_GOOGLE_CLIENT_ID:
# Portainer las sustituye abajo y se usan al CONSTRUIR la imagen (Next las fija en el build).
# Si cambian, hay que reconstruir la imagen ("Re-pull and redeploy" / "Build").
#
# Publicación con el Traefik existente en la VM (https://DOMINIO/).
#   DOMINIO               ej. conciliacion.fabribat.com
#   TRAEFIK_NETWORK       red Docker donde está Traefik      (por defecto: traefik)
#   TRAEFIK_ENTRYPOINT    entrypoint HTTPS de Traefik        (por defecto: websecure)
#   TRAEFIK_CERTRESOLVER  certresolver de Let's Encrypt      (por defecto: letsencrypt)
services:
  fabribat-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Defina NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?Defina NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: fabribat-frontend:latest
    container_name: fabribat-frontend
    restart: unless-stopped
    # Solo accesible desde la propia VM; el público entra por Traefik
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.fabribat-web.rule=Host(`${DOMINIO:?Defina DOMINIO}`)"
      - "traefik.http.routers.fabribat-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fabribat-web.tls=true"
      - "traefik.http.routers.fabribat-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.fabribat-web.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
